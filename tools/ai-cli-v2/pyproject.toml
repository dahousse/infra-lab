[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ai-cli-v2"
version = "2.5.0"
description = "OS Prompt CLI — INFRA LAB VM management via Proxmox + Ansible + Traefik"
authors = [{name = "hasmi"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.scripts]
ai = "cli_ai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli_ai*", "commands*", "core*", "engines*", "utils_ai*"]
