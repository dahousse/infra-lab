---
name: 🔧 Infra Lab CI (tools + docs)

on:
  push:
    branches: [ main, feature/* ]
    paths:
      - tools/**
      - docs/**
      - .github/workflows/*
  pull_request:
    branches: [ main ]
    paths:
      - tools/**
      - docs/**

jobs:
  validate:
    name: Validate tools + docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          pip install ruff --quiet

      - name: YAML Lint
        run: |
          find . -name *.yml -o -name *.yaml | xargs -r yamllint -d {extends: relaxed, rules: {line-length: disable}} || true

      - name: Python Lint (ruff) - ai-cli-v2
        run: |
          if [ -d tools/ai-cli-v2 ]; then
            ruff check tools/ai-cli-v2/ --quiet || true
            ruff format tools/ai-cli-v2/ --check --quiet || true
          else
            echo "tools/ai-cli-v2/ not found - skipping"
          fi

      - name: Structure check
        run: |
          echo "=== docs/ ===" && ls docs/ 2>/dev/null || echo "missing"
          echo "=== tools/ ===" && ls tools/ 2>/dev/null || echo "missing"
          echo "=== AGENTS.md ===" && head -5 docs/AGENTS.md 2>/dev/null || echo "missing"
