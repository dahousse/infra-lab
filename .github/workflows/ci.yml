---
name: 🔧 Infra Lab CI (tools/docs)

on:
  push:
    branches: [ main, feature/* ]
    paths:
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/*'
  pull_request:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'docs/**'

jobs:
  validate:
    name: Validate tools + docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: YAML Lint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          find . -name '*.yml' -o -name '*.yaml' | xargs -r yamllint -d '{extends: relaxed, rules: {line-length: disable}}' || true

      - name: Structure check
        run: |
          echo "=== docs/ ===" && ls docs/ 2>/dev/null || echo "❌ missing"
          echo "=== tools/ ===" && ls tools/ 2>/dev/null || echo "❌ missing"
          echo "=== AGENTS.md ===" && head -5 docs/AGENTS.md 2>/dev/null || echo "❌ missing"
