---
name: CI - Validation des Playbooks Ansible

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-check:
    name: Lint & Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Validation YAML (playbooks uniquement)
        run: |
          find ansible -name "*.yml" -or -name "*.yaml" | while read file; do
            echo "Vérification de $file"
            ansible-playbook "$file" --syntax-check || true
          done

      - name: Vérification de l'inventaire
        run: ansible-inventory -i ansible/hosts --list
