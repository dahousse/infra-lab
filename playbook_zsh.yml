---
- name: Configuration Zsh et outils CLI
  hosts: tous_mes_serveurs
  become: yes
  vars:
    ohmyzsh_repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    zshrc_template: "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/templates/zshrc.zsh-template"

  tasks:
    - name: Installer les paquets essentiels
      package:
        name:
          - zsh
          - htop
          - fastfetch
          - git
          - curl
        state: present

    - name: Installer glances (version CLI)
      package:
        name: glances
        state: present

    - name: Définir Zsh comme shell par défaut pour root
      user:
        name: root
        shell: /usr/bin/zsh

    - name: Vérifier si l'utilisateur hasmi existe
      getent:
        database: passwd
        key: hasmi
      register: hasmi_exists

    - name: Définir Zsh comme shell par défaut pour hasmi
      user:
        name: hasmi
        shell: /usr/bin/zsh
      when: hasmi_exists is success

    - name: Installer Oh My Zsh pour root
      git:
        repo: "{{ ohmyzsh_repo }}"
        dest: /root/.oh-my-zsh
        depth: 1

    - name: Télécharger le template .zshrc pour root
      get_url:
        url: "{{ zshrc_template }}"
        dest: /root/.zshrc
        mode: '0644'

    - name: Installer Oh My Zsh pour hasmi (si présent)
      git:
        repo: "{{ ohmyzsh_repo }}"
        dest: /home/hasmi/.oh-my-zsh
        depth: 1
      when: hasmi_exists is success

    - name: Copier le .zshrc pour hasmi
      copy:
        src: /root/.zshrc
        dest: /home/hasmi/.zshrc
        owner: hasmi
        group: hasmi
        mode: '0644'
        remote_src: yes
      when: hasmi_exists is success
